name: CLA signature

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
    paths: [CLA.md, cla/**, scripts/cla.py, scripts/cla/**, .github/workflows/cla.yml]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cla-signatures-${{ github.repository }}
  cancel-in-progress: false

jobs:
  signature:
    if: github.repository == 'DapengFeng/wgpt-community' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Signing instructions are PR comments; Issues write alone returned HTTP 403.
      pull-requests: write
      statuses: write
    steps:
      # Never check out the contributor's branch or execute PR-provided code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check trusted gate tests
        run: python -m unittest discover -s tests -p 'test_cla.py'
      - name: Publish head-bound CLA status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/cla.py
