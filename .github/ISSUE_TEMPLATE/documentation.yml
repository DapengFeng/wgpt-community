name: Documentation improvement
description: Report missing, unclear, or incorrect documentation and examples
title: "[Docs]: "

body:
- type: markdown
  attributes:
    value: |
      Search existing issues before submitting, and follow this project's contribution guidelines.
      Include the affected page or file and enough context to verify the suggested correction.
- type: textarea
  id: location
  attributes:
    label: Documentation Location
    description: Link to the page or file and section; include the documentation version if applicable.
    placeholder: README.md, Quick start section, on the default branch.
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Problem / Missing Information
    description: Explain what is incorrect, unclear, or missing and which task it prevents you from completing.
    placeholder: The setup instructions describe running hooks but omit how to install pre-commit.
  validations:
    required: true
- type: textarea
  id: proposed_change
  attributes:
    label: Proposed Change
    description: Suggest a correction or outline the information you expected to find.
    placeholder: Add installation prerequisites before the first validation command and link to supported setup instructions.
- type: textarea
  id: validation
  attributes:
    label: Verification / Supporting Evidence
    description: Provide broken links, failing example commands, or steps that would verify the updated documentation.
    placeholder: Follow the quick start from a clean environment and confirm that every command can be run in order.
